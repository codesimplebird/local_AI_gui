<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marked.js with Highlight.js for Streaming Text</title>
    <link rel="stylesheet" href="../node_modules/styles/atom-one-dark.css">
    <script src="../node_modules/marked/marked.min.js"></script>
    <script src="../node_modules/highlight.min.js"></script>
    <script src="../node_modules/clipboard.min.js"></script>
</head>
<style>
    /* ========== DARK THEME (default) ========== */
    :root,
    [data-theme="dark"] {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --text-muted: #8b949e;
        --heading: #f0f6fc;
        --code-bg: #161b22;
        --code-color: #ff7b72;
        --pre-bg: #0d1117;
        --ai-accent: #00d4ff;
        --ai-glow: rgba(0, 212, 255, 0.15);
        --ai-bg: rgba(0, 212, 255, 0.04);
        --ai-label-bg: rgba(0, 212, 255, 0.08);
        --ai-label-border: rgba(0, 212, 255, 0.2);
        --ai-bubble-border: rgba(0, 212, 255, 0.15);
        --ai-bubble-shadow: 0 0 12px var(--ai-glow);
        --user-accent: #a371f7;
        --user-glow: rgba(163, 113, 247, 0.15);
        --user-bg: rgba(163, 113, 247, 0.04);
        --user-label-bg: rgba(163, 113, 247, 0.08);
        --user-label-border: rgba(163, 113, 247, 0.2);
        --user-bubble-border: rgba(163, 113, 247, 0.15);
        --user-bubble-shadow: 0 0 12px var(--user-glow);
        --think-bg: rgba(0, 212, 255, 0.03);
        --think-border: rgba(0, 212, 255, 0.12);
        --blockquote-bg: rgba(0, 212, 255, 0.03);
        --scroll-thumb: #30363d;
        --scroll-thumb-hover: #484f58;
        --copy-btn-bg: #161b22;
        --radius: 10px;
        --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }

    /* ========== LIGHT THEME ========== */
    [data-theme="light"] {
        --bg: #ffffff;
        --surface: #f6f8fa;
        --border: #d0d7de;
        --text: #1f2328;
        --text-muted: #656d76;
        --heading: #1f2328;
        --code-bg: #f6f8fa;
        --code-color: #cf222e;
        --pre-bg: #f6f8fa;
        --ai-accent: #0969da;
        --ai-glow: none;
        --ai-bg: #f6f8fa;
        --ai-label-bg: #ddf4ff;
        --ai-label-border: #54aeff;
        --ai-bubble-border: #d0d7de;
        --ai-bubble-shadow: none;
        --user-accent: #8250df;
        --user-glow: none;
        --user-bg: #f6f8fa;
        --user-label-bg: #fbefff;
        --user-label-border: #d2a8ff;
        --user-bubble-border: #d0d7de;
        --user-bubble-shadow: none;
        --think-bg: #f6f8fa;
        --think-border: #d0d7de;
        --blockquote-bg: #f6f8fa;
        --scroll-thumb: #d0d7de;
        --scroll-thumb-hover: #afb8c1;
        --copy-btn-bg: #f6f8fa;
    }

    * { box-sizing: border-box; }

    html {
        font-size: 15px; /* base: JS setFontSize() overrides this */
    }
    html, body {
        margin: 0; padding: 0;
        overflow-y: scroll; overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        line-height: 1.6;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

    #container {
        max-width: 820px; margin: 0 auto;
        padding: 24px 20px 60px;
    }

    .msg-row {
        margin-bottom: 20px;
        animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .msg-label {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 0.733rem; font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 6px; padding: 3px 10px;
        border-radius: 4px;
        font-family: var(--font-mono);
    }
    .msg-label.ai {
        color: var(--ai-accent);
        background: var(--ai-label-bg);
        border: 1px solid var(--ai-label-border);
    }
    .msg-label.user {
        color: var(--user-accent);
        background: var(--user-label-bg);
        border: 1px solid var(--user-label-border);
    }
    .msg-label .dot {
        width: 6px; height: 6px; border-radius: 50%; display: inline-block;
    }
    .msg-label.ai .dot { background: var(--ai-accent); box-shadow: 0 0 6px var(--ai-accent); }
    .msg-label.user .dot { background: var(--user-accent); box-shadow: 0 0 6px var(--user-accent); }

    .msg-bubble {
        padding: 14px 18px; border-radius: var(--radius);
        position: relative; word-wrap: break-word;
    }
    .msg-bubble.ai {
        background: var(--ai-bg);
        border: 1px solid var(--ai-bubble-border);
        box-shadow: inset 0 0 30px rgba(0, 212, 255, 0.02), var(--ai-bubble-shadow);
    }
    .msg-bubble.user {
        background: var(--user-bg);
        border: 1px solid var(--user-bubble-border);
        box-shadow: inset 0 0 30px rgba(163, 113, 247, 0.02), var(--user-bubble-shadow);
    }

    .msg-bubble p  { margin: 0 0 10px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble code {
        background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
        font-family: var(--font-mono); font-size: 0.867rem; color: var(--code-color);
    }
    .msg-bubble pre {
        background: var(--pre-bg); border: 1px solid var(--border);
        border-radius: 8px; padding: 14px 16px;
        overflow-x: auto; margin: 10px 0; position: relative;
    }
    .msg-bubble pre code {
        background: transparent; padding: 0; color: var(--text); font-size: 0.867rem;
    }
    .msg-bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    .msg-bubble th, .msg-bubble td {
        border: 1px solid var(--border); padding: 8px 12px; text-align: left;
    }
    .msg-bubble th { background: var(--surface); font-weight: 600; }
    .msg-bubble blockquote {
        border-left: 3px solid var(--ai-accent);
        margin: 10px 0; padding: 4px 14px;
        color: var(--text-muted); background: var(--blockquote-bg);
        border-radius: 0 6px 6px 0;
    }
    .msg-bubble a { color: var(--ai-accent); text-decoration: none; }
    .msg-bubble a:hover { text-decoration: underline; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 22px; margin: 6px 0; }
    .msg-bubble li { margin-bottom: 4px; }
    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3, .msg-bubble h4 {
        margin: 16px 0 8px; font-weight: 600; color: var(--heading);
    }
    .msg-bubble h1 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .msg-bubble h2 { font-size: 1.2em; }
    .msg-bubble h3 { font-size: 1.05em; }

    .copy-button {
        position: absolute; top: 8px; right: 8px;
        background: var(--copy-btn-bg); border: 1px solid var(--border);
        color: var(--text-muted); font-size: 0.733rem;
        padding: 4px 10px; border-radius: 4px; cursor: pointer;
        font-family: var(--font-mono); transition: all 0.2s;
    }
    .copy-button:hover {
        color: var(--ai-accent); border-color: var(--ai-accent);
    }

    .thinking-indicator {
        display: flex; align-items: center; gap: 4px;
        padding: 12px 18px; margin-bottom: 20px;
        color: var(--ai-accent); font-size: 0.867rem;
        font-family: var(--font-mono); letter-spacing: 0.04em;
        background: var(--think-bg); border: 1px solid var(--think-border);
        border-radius: var(--radius);
        max-width: 820px; margin-left: auto; margin-right: auto;
    }
    .thinking-indicator .dot {
        width: 5px; height: 5px;
        background: var(--ai-accent); border-radius: 50%;
        animation: pulse 1.2s infinite both;
    }
    .thinking-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50%      { opacity: 1;   transform: scale(1.3); }
    }

    /* highlight.js theme override for light mode */
    [data-theme="light"] .msg-bubble pre code { color: #1f2328; }
</style>

<body>
    <div id="container"></div>
    <div id="scroll_point"></div>
    <script>
        hljs.initHighlightingOnLoad();
        hljs.configure({ ignoreUnescapedHTML: true });

        new ClipboardJS('.copy-button');

        marked.setOptions({
            highlight: function (code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                } else {
                    return hljs.highlightAuto(code).value;
                }
            }
        });

        const scroll_point = document.getElementById('scroll_point');
        const container = document.getElementById('container');

        let userScrolledUp = false;
        const SCROLL_THRESHOLD = 60;

        function isNearBottom() {
            const scrollBottom = window.innerHeight + window.scrollY;
            const docHeight = document.documentElement.scrollHeight;
            return docHeight - scrollBottom < SCROLL_THRESHOLD;
        }

        window.addEventListener('scroll', () => {
            if (isNearBottom()) {
                userScrolledUp = false;
            } else {
                userScrolledUp = true;
            }
        }, { passive: true });

        function safeScrollToBottom() {
            if (!userScrolledUp) {
                scroll_point.scrollIntoView(false);
            }
        }

        function makeMsgRow(role, label) {
            const row = document.createElement('div');
            row.className = 'msg-row';
            row.innerHTML =
                `<div class="msg-label ${role}"><span class="dot"></span>${label}</div>` +
                `<div class="msg-bubble ${role}"></div>`;
            container.appendChild(row);
            safeScrollToBottom();
            return row.querySelector('.msg-bubble');
        }

        let currentAiBubble = null;

        function processStreamingText(bubble, text, shouldHighlight) {
            const htmlContent = marked.marked(text, {
                gfm: true, tables: true, breaks: false,
                pedantic: false, sanitize: true, smartLists: true, smartypants: false,
            });
            bubble.innerHTML = htmlContent;
            safeScrollToBottom();

            if (shouldHighlight) {
                bubble.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightBlock(block);
                });
            }
        }

        let tmp_text = "";
        let renderScheduled = false;
        let isStreamEnd = false;
        let lastRenderTime = 0;
        const RENDER_THROTTLE_MS = 120;  // 流式期间最少渲染间隔，避免 O(n²) 重渲染

        function receive_text(text, if_end) {
            tmp_text += text;
            isStreamEnd = (if_end == 1);

            // 流结束时立即最终渲染（带代码高亮）
            if (isStreamEnd) {
                if (renderScheduled) {
                    renderScheduled = false;
                }
                if (!currentAiBubble) {
                    currentAiBubble = makeMsgRow('ai', 'AI');
                }
                processStreamingText(currentAiBubble, tmp_text, true);
                tmp_text = "";
                currentAiBubble = null;
                addCopyButton();
                return;
            }

            // 流式期间：节流渲染，避免每个 chunk 都全量 marked.parse
            const now = Date.now();
            if (!renderScheduled && now - lastRenderTime >= RENDER_THROTTLE_MS) {
                renderScheduled = true;
                requestAnimationFrame(() => {
                    renderScheduled = false;
                    lastRenderTime = Date.now();
                    if (!currentAiBubble) {
                        currentAiBubble = makeMsgRow('ai', 'AI');
                    }
                    processStreamingText(currentAiBubble, tmp_text + '|', false);
                });
            }
        }

        function user_text(content) {
            const bubble = makeMsgRow('user', 'USER');
            bubble.innerHTML = '<p>' + content + '</p>';
            safeScrollToBottom();
            currentAiBubble = makeMsgRow('ai', 'AI');
        }

        function reload_ai_info(text) {
            if (!currentAiBubble) {
                currentAiBubble = makeMsgRow('ai', 'AI');
            }
            processStreamingText(currentAiBubble, text, true);
            currentAiBubble = null;
        }

        function clear_chat() {
            container.innerHTML = '';
            currentAiBubble = null;
            hideThinking();
        }

        function addCopyButton() {
            document.querySelectorAll('.msg-bubble pre').forEach((pre) => {
                if (!pre.querySelector('.copy-button')) {
                    const codeBlock = pre.querySelector('code');
                    const id = 'code-' + Math.random().toString(36).slice(2, 8);
                    if (codeBlock) codeBlock.id = id;

                    const btn = document.createElement('button');
                    btn.innerText = 'COPY';
                    btn.className = 'copy-button';
                    if (codeBlock) btn.dataset.clipboardTarget = '#' + id;
                    pre.style.position = 'relative';
                    pre.appendChild(btn);
                }
            });
        }

        function showThinking() {
            hideThinking();
            const indicator = document.createElement('div');
            indicator.className = 'thinking-indicator';
            indicator.innerHTML =
                'THINKING<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
            container.appendChild(indicator);
            safeScrollToBottom();
        }
        function hideThinking() {
            const el = document.querySelector('.thinking-indicator');
            if (el) el.remove();
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }

        const FONT_SIZES = { small: '13px', medium: '15px', large: '17px' };
        function setFontSize(size) {
            document.documentElement.style.fontSize =
                FONT_SIZES[size] || FONT_SIZES.medium;
        }

        function postMessage(msg) {
            try {
                switch (msg.type) {
                    case 'user_msg':
                        hideThinking();
                        currentAiBubble = null;
                        user_text(msg.payload.content);
                        break;
                    case 'ai_stream':
                        hideThinking();
                        receive_text(msg.payload.text, msg.payload.done ? 1 : 0);
                        break;
                    case 'thinking':
                        showThinking();
                        break;
                    case 'clear':
                        clear_chat();
                        break;
                    case 'add_copy_btn':
                        addCopyButton();
                        break;
                    case 'reload_ai':
                        hideThinking();
                        reload_ai_info(msg.payload.content);
                        break;
                    case 'set_theme':
                        setTheme(msg.payload.theme);
                        break;
                    case 'set_font_size':
                        setFontSize(msg.payload.size);
                        break;
                    default:
                        console.warn('postMessage: unknown type:', msg.type);
                }
            } catch (e) {
                console.error('postMessage: error processing', msg.type, e.message);
            }
        }
    </script>
</body>

</html>
